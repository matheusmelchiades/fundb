<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Graphs: 3 nodes connected in a triangle -->
  <g stroke="#0D9488" stroke-width="2" stroke-linecap="round">
    <!-- Edges -->
    <line x1="24" y1="10" x2="10" y2="36"/>
    <line x1="24" y1="10" x2="38" y2="36"/>
    <line x1="10" y1="36" x2="38" y2="36"/>
  </g>
  <!-- Nodes -->
  <circle cx="24" cy="10" r="5" fill="#0D9488"/>
  <circle cx="10" cy="36" r="5" fill="#0D9488"/>
  <circle cx="38" cy="36" r="5" fill="#0D9488"/>
  <!-- Inner dots -->
  <circle cx="24" cy="10" r="2" fill="white"/>
  <circle cx="10" cy="36" r="2" fill="white"/>
  <circle cx="38" cy="36" r="2" fill="white"/>
</svg>