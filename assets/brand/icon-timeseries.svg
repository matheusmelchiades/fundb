<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Time-Series: Sine wave with data points -->
  <g stroke="#E11D48" stroke-width="2.5" stroke-linecap="round" fill="none">
    <!-- Wave path -->
    <path d="M6,30 Q12,10 18,24 Q24,38 30,20 Q36,6 42,18"/>
  </g>
  <!-- Data points -->
  <circle cx="6" cy="30" r="3" fill="#E11D48"/>
  <circle cx="18" cy="24" r="3" fill="#E11D48"/>
  <circle cx="30" cy="20" r="3" fill="#E11D48"/>
  <circle cx="42" cy="18" r="3" fill="#E11D48"/>
  <!-- Inner dots -->
  <circle cx="6" cy="30" r="1.5" fill="white"/>
  <circle cx="18" cy="24" r="1.5" fill="white"/>
  <circle cx="30" cy="20" r="1.5" fill="white"/>
  <circle cx="42" cy="18" r="1.5" fill="white"/>
</svg>