<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- FunDB Icon - Synaptic Convergence (standalone) -->

  <g transform="translate(50, 50)">
    <!-- Central node (rounded square) -->
    <rect x="-16" y="-16" width="32" height="32" rx="8" fill="#E8872B"/>

    <!-- 5 convergence paths -->
    <!-- Vectors (violet) - top-left -->
    <path d="M-40,-34 Q-22,-20 -12,-12" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Graphs (teal) - top-right -->
    <path d="M40,-34 Q22,-20 12,-12" stroke="#0D9488" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Documents (blue) - left -->
    <path d="M-44,6 Q-28,4 -14,1" stroke="#2563EB" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Time-Series (rose) - right -->
    <path d="M44,6 Q28,4 14,1" stroke="#E11D48" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Agent Memory (gold) - bottom -->
    <path d="M0,42 Q0,28 0,14" stroke="#D97706" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Endpoint dots -->
    <circle cx="-40" cy="-34" r="4" fill="#7C3AED"/>
    <circle cx="40" cy="-34" r="4" fill="#0D9488"/>
    <circle cx="-44" cy="6" r="4" fill="#2563EB"/>
    <circle cx="44" cy="6" r="4" fill="#E11D48"/>
    <circle cx="0" cy="42" r="4" fill="#D97706"/>

    <!-- Central glow -->
    <rect x="-16" y="-16" width="32" height="32" rx="8" fill="#E8872B" opacity="0.15" filter="url(#glow)"/>
  </g>

  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>