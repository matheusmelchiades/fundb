<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" fill="none">
  <!-- GitHub Social Preview - 1280x640 -->

  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F0F1A"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="amber-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8872B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#C46A15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg-gradient)"/>

  <!-- Subtle convergence pattern background decoration -->
  <g opacity="0.06" stroke="#E8872B" stroke-width="1">
    <line x1="0" y1="0" x2="640" y2="320"/>
    <line x1="1280" y1="0" x2="640" y2="320"/>
    <line x1="0" y1="640" x2="640" y2="320"/>
    <line x1="1280" y1="640" x2="640" y2="320"/>
    <line x1="640" y1="640" x2="640" y2="320"/>
  </g>

  <!-- Logo icon (centered, large) -->
  <g transform="translate(640, 220)">
    <!-- Central node -->
    <rect x="-32" y="-32" width="64" height="64" rx="16" fill="#E8872B" filter="url(#glow)"/>

    <!-- 5 convergence paths -->
    <path d="M-80,-68 Q-44,-40 -24,-24" stroke="#7C3AED" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M80,-68 Q44,-40 24,-24" stroke="#0D9488" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M-90,12 Q-56,8 -28,2" stroke="#2563EB" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M90,12 Q56,8 28,2" stroke="#E11D48" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M0,84 Q0,56 0,28" stroke="#D97706" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Endpoint dots -->
    <circle cx="-80" cy="-68" r="6" fill="#7C3AED"/>
    <circle cx="80" cy="-68" r="6" fill="#0D9488"/>
    <circle cx="-90" cy="12" r="6" fill="#2563EB"/>
    <circle cx="90" cy="12" r="6" fill="#E11D48"/>
    <circle cx="0" cy="84" r="6" fill="#D97706"/>
  </g>

  <!-- Wordmark -->
  <text x="640" y="400" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="72" letter-spacing="-2">
    <tspan fill="#E8872B">Fun</tspan><tspan fill="#E5E7EB">DB</tspan>
  </text>

  <!-- Tagline -->
  <text x="640" y="445" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="400" font-size="22" fill="#6B7280">
    The cognitive database for the AI era
  </text>

  <!-- 5 data type icons strip -->
  <g transform="translate(440, 500)">
    <!-- Vectors -->
    <g transform="translate(0, 0)">
      <circle cx="16" cy="16" r="16" fill="#7C3AED" opacity="0.15"/>
      <text x="16" y="21" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#7C3AED">V</text>
      <text x="16" y="48" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">Vectors</text>
    </g>
    <!-- Graphs -->
    <g transform="translate(100, 0)">
      <circle cx="16" cy="16" r="16" fill="#0D9488" opacity="0.15"/>
      <text x="16" y="21" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0D9488">G</text>
      <text x="16" y="48" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">Graphs</text>
    </g>
    <!-- Documents -->
    <g transform="translate(200, 0)">
      <circle cx="16" cy="16" r="16" fill="#2563EB" opacity="0.15"/>
      <text x="16" y="21" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#2563EB">D</text>
      <text x="16" y="48" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">Docs</text>
    </g>
    <!-- Time-Series -->
    <g transform="translate(300, 0)">
      <circle cx="16" cy="16" r="16" fill="#E11D48" opacity="0.15"/>
      <text x="16" y="21" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#E11D48">T</text>
      <text x="16" y="48" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">Time</text>
    </g>
    <!-- Agent Memory -->
    <g transform="translate(400, 0)">
      <circle cx="16" cy="16" r="16" fill="#D97706" opacity="0.15"/>
      <text x="16" y="21" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#D97706">M</text>
      <text x="16" y="48" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">Memory</text>
    </g>
  </g>

  <!-- Bottom bar with tech badges -->
  <g transform="translate(480, 600)">
    <text x="0" y="0" font-family="JetBrains Mono, 'SF Mono', monospace" font-size="13" fill="#3D5A80">
      Built in Rust  |  PostgreSQL Compatible  |  Apache-2.0
    </text>
  </g>
</svg>