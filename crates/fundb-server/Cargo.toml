[package]
name        = "fundb-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "fundb-server"
path = "src/main.rs"

[dependencies]
tokio.workspace              = true
tracing.workspace            = true
tracing-subscriber.workspace = true
anyhow.workspace             = true
async-trait.workspace        = true
serde.workspace              = true
uuid.workspace               = true
thiserror.workspace          = true
fundb-protocol  = { path = "../fundb-protocol" }
fundb-core      = { path = "../fundb-core" }
fundb-storage   = { path = "../fundb-storage" }
fundb-executor  = { path = "../fundb-executor" }
fundb-sql       = { path = "../fundb-sql" }

[[bench]]
name    = "query_bench"
harness = false

[[bench]]
name    = "storage_bench"
harness = false

[dev-dependencies]
proptest.workspace   = true
criterion.workspace  = true
