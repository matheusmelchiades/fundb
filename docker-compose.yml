version: "3.9"

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  fundb-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  fundb-data-1:
  fundb-data-2:
  fundb-data-3:

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── Single-node dev (default profile) ──────────────────────────────────────
  fundb:
    build:
      context: .
      dockerfile: Dockerfile
    image: fundb:latest
    container_name: fundb
    profiles: ["", "dev", "single"]
    ports:
      - "5433:5433"   # PG wire
      - "8080:8080"   # HTTP REST
    volumes:
      - fundb-data-1:/data
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      FUNDB_DATA_DIR: /data
      FUNDB_PG_PORT: 5433
      FUNDB_HTTP_PORT: 8080
      FUNDB_NODE_ID: 1
    networks:
      fundb-net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/5433 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── 3-node cluster (profile: cluster) ──────────────────────────────────────
  fundb-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: fundb:latest
    container_name: fundb-1
    profiles: ["cluster"]
    ports:
      - "5433:5433"
      - "8080:8080"
    volumes:
      - fundb-data-1:/data
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      FUNDB_DATA_DIR: /data
      FUNDB_PG_PORT: 5433
      FUNDB_HTTP_PORT: 8080
      FUNDB_NODE_ID: 1
      FUNDB_PEERS: "fundb-2:5433,fundb-3:5433"
    networks:
      fundb-net:
        ipv4_address: 172.28.0.11
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/5433 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  fundb-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: fundb:latest
    container_name: fundb-2
    profiles: ["cluster"]
    ports:
      - "5434:5433"
      - "8081:8080"
    volumes:
      - fundb-data-2:/data
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      FUNDB_DATA_DIR: /data
      FUNDB_PG_PORT: 5433
      FUNDB_HTTP_PORT: 8080
      FUNDB_NODE_ID: 2
      FUNDB_PEERS: "fundb-1:5433,fundb-3:5433"
    networks:
      fundb-net:
        ipv4_address: 172.28.0.12
    depends_on:
      fundb-1:
        condition: service_healthy
    restart: unless-stopped

  fundb-3:
    build:
      context: .
      dockerfile: Dockerfile
    image: fundb:latest
    container_name: fundb-3
    profiles: ["cluster"]
    ports:
      - "5435:5433"
      - "8082:8080"
    volumes:
      - fundb-data-3:/data
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      FUNDB_DATA_DIR: /data
      FUNDB_PG_PORT: 5433
      FUNDB_HTTP_PORT: 8080
      FUNDB_NODE_ID: 3
      FUNDB_PEERS: "fundb-1:5433,fundb-2:5433"
    networks:
      fundb-net:
        ipv4_address: 172.28.0.13
    depends_on:
      fundb-1:
        condition: service_healthy
    restart: unless-stopped
