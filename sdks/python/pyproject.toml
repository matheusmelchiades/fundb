[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fundb"
version = "0.1.0"
description = "Python SDK for FunDB — the AI-native cognitive database"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
    "psycopg2-binary>=2.9",
    "asyncpg>=0.28",
]

[project.optional-dependencies]
async = ["asyncpg>=0.28"]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[tool.setuptools.packages.find]
where = ["."]
