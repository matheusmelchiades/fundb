<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- FunDB file icon (dark) — Synaptic Convergence adapted for 32x32 -->

  <g transform="translate(16, 16)">
    <!-- Central node (rounded square) -->
    <rect x="-5" y="-5" width="10" height="10" rx="2.5" fill="#E8872B"/>

    <!-- 5 convergence paths — 2.5px duotone style per brand guide -->
    <!-- Vectors (violet) - top-left -->
    <path d="M-13,-11 Q-7,-6 -4,-4" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Graphs (teal) - top-right -->
    <path d="M13,-11 Q7,-6 4,-4" stroke="#0D9488" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Documents (blue) - left -->
    <path d="M-14,2 Q-9,1 -4,0" stroke="#2563EB" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Time-Series (rose) - right -->
    <path d="M14,2 Q9,1 4,0" stroke="#E11D48" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Agent Memory (gold) - bottom -->
    <path d="M0,13 Q0,9 0,4" stroke="#D97706" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Endpoint dots -->
    <circle cx="-13" cy="-11" r="1.8" fill="#7C3AED"/>
    <circle cx="13" cy="-11" r="1.8" fill="#0D9488"/>
    <circle cx="-14" cy="2" r="1.8" fill="#2563EB"/>
    <circle cx="14" cy="2" r="1.8" fill="#E11D48"/>
    <circle cx="0" cy="13" r="1.8" fill="#D97706"/>
  </g>
</svg>
